[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:mongo]
command=mongod --dbpath /home/user/data/db --bind_ip 127.0.0.1 --port 27017
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ai-service]
command=/home/user/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/home/user/ai-service
environment=CHROMA_DIR="/home/user/data/chroma"
priority=2
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:server]
command=node index.js
directory=/home/user/server
environment=PORT="5000",MONGO_URL="mongodb://127.0.0.1:27017/matterassist",AI_URL="http://127.0.0.1:8000"
priority=3
autorestart=true
startretries=50
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /home/user/nginx.conf -g "daemon off;"
priority=4
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true